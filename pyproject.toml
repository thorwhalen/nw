[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "nw"
# Bumped to match PyPI's latest (0.0.5) so the CI publish bumps to 0.0.6
# instead of colliding on an already-published version — the local pyproject
# had drifted to 0.0.1 while PyPI advanced to 0.0.5.
version = "0.0.31"
description = "Narrative Workflow"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "pydantic>=2.6",
    # >=0.0.24 for content-addressed artifacts: below it `Artifact.asset_id` is
    # `sha256(url)`, so a byte-identical upstream regeneration misses the cache
    # downstream — which defeats the freshness work nw exists to make cheap. It
    # is also the floor at which `falaw.content` exists, the seam nw's test
    # suite injects a fake asset transport into to stay offline (nw#35).
    # Raised to >=0.0.25 for `execute_plan_isolated` + `ExecutionReport`, which
    # `BaseTransform.execute` now runs both of its failure policies through
    # (nw#25). Verified against the tags, not inferred: 0.0.25 is the first
    # release containing `falaw/outcomes.py`.
    # Raised to >=0.0.27 for `falaw.testing` — the shared fake asset transport
    # nw's test suite now re-exports instead of hand-rolling (falaw#27).
    # Verified against the published wheels, not inferred: 0.0.27 is the first
    # release shipping `falaw/testing.py`, with everything nw imports
    # (`make_fake_assets_fixture`, the two other fixtures,
    # `OutboundNetworkAttempt`) present from the start.
    "falaw>=0.0.36",
    # >=0.0.25 for `lacing.digest.annotation_value_digest` — the content digest
    # `nw.freshness` compares to cut off early. 0.0.24 does NOT have it, so a
    # lower floor resolves to a lacing without the symbol and fails at import
    # rather than at resolve time.
    # >=0.0.31 for the store-migration ladder's registered v1->v2 step and
    # the widened ProvenanceRef union (lacing#14/D5): nw opens its project
    # stores with migrate=True, which needs the step to exist.
    "lacing>=0.0.31",
    "xdol>=0.1.11",
    "artful>=0.0.2",
    "au>=0.1.1",
    "dol",
]

[project.urls]
Homepage = "https://github.com/thorwhalen/nw"
Repository = "https://github.com/thorwhalen/nw"
Documentation = "https://thorwhalen.github.io/nw"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "pytest-postgresql>=6.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
postgres = [
    "lacing[postgres]",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]
markers = [
    "live_api: calls a real (paid) API — run it deliberately, never in CI, and exclude it with `-m \"not live_api\"`. Such a test opts out of the fake asset transport and the no-outbound-network guard in tests/conftest.py; nw has none today.",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
# nw's audio/video tests shell out to ffmpeg; Windows ffmpeg setup is finicky
# and the job was continue-on-error (informational) anyway. Linux + macOS-dev
# coverage is sufficient for this package.
test_on_windows = false

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]

# System dependencies installed by the wads `install-system-deps` CI action.
# nw's workflow/transforms/lipsync tests shell out to ffmpeg (audio slicing,
# probing), so CI must have it — its absence is why every run since 0.0.5
# (June 2025) failed and nw stopped publishing.
[tool.wads.ops.ffmpeg]
description = "Multimedia framework for video/audio processing"
url = "https://ffmpeg.org/"
check.linux = "which ffmpeg"
check.macos = "which ffmpeg"
install.linux = ["sudo apt-get update", "sudo apt-get install -y ffmpeg"]
install.macos = "brew install ffmpeg"
